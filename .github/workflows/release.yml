# Every push to main is tested, in BlockEase/TxGate and in every fork.
# Only in BlockEase/TxGate, when the tests pass and the app version
# (src-tauri/tauri.conf.json) has no release yet, installers are built for
# Windows, macOS (Apple silicon and Intel) and Linux and published as
# release v<version>. To ship a new release, raise the version and push.
# Forks never release.

name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release run at a time; a newer push waits instead of racing it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Check that all version numbers agree
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for f in package.json ui/package.json; do
            [ "$(node -p "require('./$f').version")" = "$v" ] || { echo "::error file=$f::version differs from tauri.conf.json ($v)"; exit 1; }
          done
          for f in src-tauri/Cargo.toml crates/txgate-core/Cargo.toml; do
            grep -q "^version = \"$v\"$" "$f" || { echo "::error file=$f::version differs from tauri.conf.json ($v)"; exit 1; }
          done

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: UI type check and build
        run: npm --prefix ui run build

  plan:
    name: Decide whether to release
    needs: test
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if [ "$REPO" != "BlockEase/TxGate" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tests only: releases are published from the main branch of BlockEase/TxGate, not $REPO ($REF)."
          elif git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$v is already released; raise the version in src-tauri/tauri.conf.json to publish a new one."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    name: Create draft release
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            const { owner, repo } = context.repo;
            // A draft left by an earlier failed run would collect stale files.
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
            for (const r of releases.filter((r) => r.draft && r.tag_name === tag)) {
              await github.rest.repos.deleteRelease({ owner, repo, release_id: r.id });
            }
            const { data } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `TxGate ${tag}`,
              body: [
                "Installers for Windows, macOS (Apple silicon and Intel) and Linux.",
                "",
                "The builds are not code-signed yet: macOS asks you to allow the app in System Settings → Privacy & Security, and Windows SmartScreen asks you to confirm.",
              ].join("\n"),
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    name: Build ${{ matrix.name }}
    needs: [plan, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            target: ""
            args: ""
          - name: Windows
            os: windows-latest
            target: ""
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || runner.os }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix ui ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          tauriScript: npx tauri
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [plan, create-release, build]
    runs-on: ubuntu-22.04
    steps:
      # Only reached when every platform built: a partial release stays a draft.
      - uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              make_latest: "true",
            });
